<main class="flex flex-col gap-6 w-full max-w-[1220px] mx-auto px-8 pt-6 pb-8">
  @if (auth.user(); as user) {
    <p class="text-secondary">{{ greeting }}, {{ user.firstName }}</p>
  }

  @if (insights.hasValue()) {
    <section class="flex flex-col gap-4" aria-label="Insights">
      @for (insight of insights.value(); track insight.id) {
        <article class="flex flex-col items-start gap-2 p-4 rounded-md border border-line bg-card">
          <app-severity-badge [severity]="insight.severity" />
          <h2 class="text-insight font-normal">{{ insight.headline }}</h2>
        </article>
      }
    </section>
  } @else if (insights.error()) {
    <p class="text-critical">Could not load insights. Is the Worker running?</p>
  } @else {
    <p class="text-secondary">Loading insights…</p>
  }
</main>
