<div
  class="flex min-h-screen bg-page font-sans text-ui text-ink tabular-nums antialiased"
  [attr.inert]="ask.isOpen() ? '' : null"
>
  <app-sidebar />
  <div class="flex flex-col flex-1 min-w-0">
    <app-top-bar />
    <router-outlet />
  </div>
</div>
<!-- Downloaded while the browser is idle, or on the first open: it is not needed to show a page. -->
@defer (when ask.isOpen(); prefetch on idle) {
  <app-ask-drawer />
}
