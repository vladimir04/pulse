<main class="mx-auto max-w-sm p-6">
  <h1 class="text-2xl font-semibold">Sign in</h1>
  <form class="mt-6 flex flex-col gap-3" (submit)="signIn($event, email.value, password.value)">
    <label class="flex flex-col gap-1 text-sm">
      Email
      <input
        #email
        class="rounded border border-gray-300 px-2 py-1"
        type="email"
        name="email"
        autocomplete="username"
        required
      />
    </label>
    <label class="flex flex-col gap-1 text-sm">
      Password
      <input
        #password
        class="rounded border border-gray-300 px-2 py-1"
        type="password"
        name="password"
        autocomplete="current-password"
        required
      />
    </label>
    <button class="rounded border border-gray-300 px-2 py-1" type="submit" [disabled]="pending()">
      {{ pending() ? 'Signing in…' : 'Sign in' }}
    </button>
    @if (error(); as message) {
      <p class="text-sm text-red-700" role="alert">{{ message }}</p>
    }
  </form>
</main>
